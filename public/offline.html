<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — FlyControl</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000000;
        color: #f8f9fb;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: rgba(255, 122, 0, 0.15);
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        color: #9ca3af;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        border: none;
        background: #ff7a00;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">📶</div>
      <h1>Sem conexão no momento</h1>
      <p>
        O FlyControl precisa de internet para mostrar pedidos e dados atualizados. Assim que a
        conexão voltar, é só tentar de novo — nada foi perdido.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
